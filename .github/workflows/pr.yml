name: PR correctness

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflow files with actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[ci]"
      - run: python -m ruff format --check src test scripts .github/scripts benchmark
      - run: python -m ruff check src test scripts .github/scripts benchmark
      - run: python -m mypy
      - name: Check autotune contract fallback digest
        run: |
          python -c "
          import sys; sys.path.insert(0, 'src')
          from orda_kernel._autotune._contract import (
              current_source_contract_digest,
              AUTOTUNE_TIMED_CONTRACT_FALLBACK_DIGEST,
          )
          live = current_source_contract_digest()
          stored = AUTOTUNE_TIMED_CONTRACT_FALLBACK_DIGEST
          if live != stored:
              print('::error::AUTOTUNE_TIMED_CONTRACT_FALLBACK_DIGEST is stale.')
              print(f'::error::Run: python scripts/update_contract_digest.py')
              print(f'::error::Or update _autotune/_contract.py manually to: {live}')
              sys.exit(1)
          print(f'Contract digest OK: {live}')
          "
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python .github/scripts/verify_wheel.py dist/*.whl

  cpu-full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch-spec: "torch==2.3.0"
          - python-version: "3.13"
            torch-spec: "torch>=2.3.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "${{ matrix.torch-spec }}" ".[test]"
      - run: python -m pytest -m "not gpu" test/unit test/correctness/test_torch_backend_cpu.py test/nightly/test_autotune_multiprocess.py
